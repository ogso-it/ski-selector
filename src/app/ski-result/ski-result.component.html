<div class="results-container">

    <!--======================================================
    BACKGROUND VIDEO
    ======================================================-->

    <video
        class="bg-video"
        autoplay
        muted
        loop
        playsinline
    >

        <source
            src="assets/images/BACKGROUND.webm"
            type="video/webm"
        >

    </video>


    <!--======================================================
    CONTENT
    ======================================================-->

    <div class="content-overlay">


        <!--==================================================
        HEADER
        ==================================================-->

        <header class="results-header">


            <!-- LOGO -->

            <img
                src="assets/images/ogsologo.png"
                alt="OGSO"
                class="main-logo"
            >


            <!-- HEADER ACTIONS -->

            <div class="header-actions">


                <!--==========================================
                RETAKE QUIZ
                ==========================================-->

                <button
                    type="button"
                    class="retake-btn"
                    (click)="retakeQuiz()"
                >

                    <span
                        class="btn-arrow"
                        aria-hidden="true"
                    >

                        ←

                    </span>


                    <span>

                        RETAKE THE QUIZ

                    </span>

                </button>


                <!--==========================================
                EXPORT PDF
                ==========================================-->

                <button
                    type="button"
                    class="export-btn"
                    (click)="generateAndDownloadPDF()"
                    [disabled]="isGeneratingPDF"
                >

                    <span>

                        {{
                            isGeneratingPDF
                                ? 'GENERATING...'
                                : 'EXPORT PDF'
                        }}

                    </span>


                    <span
                        class="btn-arrow"
                        aria-hidden="true"
                    >

                        →

                    </span>

                </button>


            </div>


        </header>


        <!--==================================================
        MAIN
        ==================================================-->

        <main class="results-main">


            <!--==============================================
            LOADING
            ==============================================-->

            <div
                *ngIf="isLoading"
                class="loading-state"
            >

                <div class="spinner"></div>


                <p>

                    Finding your perfect ski matches...

                </p>

            </div>


            <!--==============================================
            RESULTS
            ==============================================-->

            <div
                *ngIf="!isLoading"
                class="results-layout"
            >


                <!--==========================================
                PROFILE PANEL
                ==========================================-->

                <aside class="profile-panel">


                    <h2 class="profile-title">

                        YOUR PROFILE

                    </h2>


                    <!--======================================
                    HEIGHT
                    ======================================-->

                    <div class="profile-field">


                        <label>

                            HEIGHT

                        </label>


                        <div
                            class="profile-control slider-control"
                        >


                            <input
                                type="number"
                                [ngModel]="height"
                                (ngModelChange)="onHeightChange($event)"
                                min="140"
                                max="220"
                            >


                            <input
                                type="range"
                                [ngModel]="height"
                                (ngModelChange)="onHeightChange($event)"
                                (input)="onHeightInput($event)"
                                (mouseup)="onSliderRelease()"
                                (touchend)="onSliderRelease()"
                                min="140"
                                max="220"
                            >


                        </div>


                    </div>


                    <!--======================================
                    WEIGHT
                    ======================================-->

                    <div class="profile-field">


                        <label>

                            WEIGHT

                        </label>


                        <div
                            class="profile-control slider-control"
                        >


                            <input
                                type="number"
                                [ngModel]="weight"
                                (ngModelChange)="onWeightChange($event)"
                                min="40"
                                max="150"
                            >


                            <input
                                type="range"
                                [ngModel]="weight"
                                (ngModelChange)="onWeightChange($event)"
                                (input)="onWeightInput($event)"
                                (mouseup)="onSliderRelease()"
                                (touchend)="onSliderRelease()"
                                min="40"
                                max="150"
                            >


                        </div>


                    </div>


                    <!--======================================
                    TERRAIN
                    ======================================-->

                    <div class="profile-field">


                        <label>

                            TERRAIN

                        </label>


                        <select
                            [ngModel]="terrain_type"
                            (ngModelChange)="onTerrainChange($event)"
                        >


                            <option
                                *ngFor="
                                    let option
                                    of terrainOptions
                                "
                                [value]="option"
                            >

                                {{
                                    formatTerrain(
                                        option
                                    )
                                }}

                            </option>


                        </select>


                    </div>


                    <!--======================================
                    SNOW
                    ======================================-->

                    <div class="profile-field">


                        <label>

                            SNOW

                        </label>


                        <select
                            [ngModel]="type_snow"
                            (ngModelChange)="onSnowChange($event)"
                        >


                            <option
                                *ngFor="
                                    let option
                                    of snowOptions
                                "
                                [value]="option"
                            >

                                {{
                                    formatSnow(
                                        option
                                    )
                                }}

                            </option>


                        </select>


                    </div>


                    <!--======================================
                    STYLE
                    ======================================-->

                    <div class="profile-field">


                        <label>

                            STYLE

                        </label>


                        <select
                            [ngModel]="ski_level_fun"
                            (ngModelChange)="onStyleChange($event)"
                        >


                            <option
                                *ngFor="
                                    let option
                                    of funOptions
                                "
                                [value]="option"
                            >

                                {{
                                    formatStyle(
                                        option
                                    )
                                }}

                            </option>


                        </select>


                    </div>


                    <!--======================================
                    TURNS
                    ======================================-->

                    <div class="profile-field">


                        <label>

                            TURNS

                        </label>


                        <select
                            [ngModel]="ski_turns"
                            (ngModelChange)="onTurnsChange($event)"
                        >


                            <option
                                *ngFor="
                                    let option
                                    of turnOptions
                                "
                                [value]="option"
                            >

                                {{
                                    formatTurns(
                                        option
                                    )
                                }}

                            </option>


                        </select>


                    </div>


                    <!--======================================
                    SPEED
                    ======================================-->

                    <div class="profile-field">


                        <label>

                            SPEED

                        </label>


                        <select
                            [ngModel]="ski_speed"
                            (ngModelChange)="onSpeedChange($event)"
                        >


                            <option
                                *ngFor="
                                    let option
                                    of speedOptions
                                "
                                [value]="option"
                            >

                                {{
                                    formatSpeed(
                                        option
                                    )
                                }}

                            </option>


                        </select>


                    </div>


                </aside>


                <!--==========================================
                RESULTS PANEL
                ==========================================-->

                <section class="results-panel">


                    <h1 class="results-title">

                        YOUR PERFECT MATCH

                    </h1>


                    <!--======================================
                    CARDS
                    ======================================-->

                    <div class="cards-grid">


                        <article
                            class="ski-card"
                            *ngFor="
                                let ski
                                of resultat | slice:0:3;
                                let i = index
                            "
                        >


                            <!--================================
                            RANK
                            ================================-->

                            <div
                                class="card-rank"
                                [style.background]="getRankColor(i)"
                            >

                                {{ i + 1 }}

                            </div>


                            <!--================================
                            NAME
                            ================================-->

                            <h2 class="ski-name">

                                {{ ski.name }}

                            </h2>


                            <!--================================
                            FAMILY
                            ================================-->

                            <p class="ski-family">

                                {{ ski.family }}

                            </p>


                            <!--================================
                            SIZE + SIDECUT
                            ================================-->

                            <p class="ski-size">

                                {{ ski.size }} cm

                                /

                                {{ ski.sidecut || 'N/A' }} mm

                            </p>


                            <!--================================
                            IMAGE
                            ================================-->

                            <div class="ski-image">


                                <img
                                    [src]="ski.src"
                                    [alt]="ski.name"
                                >


                            </div>


                            <!--================================
                            ACTIONS
                            ================================-->

                            <div class="card-actions">


                                <!-- DISCOVER -->

                                <button
                                    type="button"
                                    class="discover-btn"
                                    (click)="openSki(ski)"
                                >

                                    DISCOVER THE SKI

                                    <span
                                        aria-hidden="true"
                                    >

                                        →

                                    </span>

                                </button>


                                <!-- DEALER -->

                                <button
                                    type="button"
                                    class="dealer-btn"
                                    (click)="openDealer()"
                                >

                                    FIND A DEALER

                                    <span
                                        aria-hidden="true"
                                    >

                                        →

                                    </span>

                                </button>


                            </div>


                        </article>


                    </div>


                </section>


            </div>


        </main>


    </div>


    <!--======================================================
    PDF LOADING
    ======================================================-->

    <div
        class="pdf-overlay"
        *ngIf="isGeneratingPDF"
    >


        <div class="spinner"></div>


        <p>

            Generating PDF...

        </p>


    </div>


    <!--======================================================
    PDF SUCCESS
    ======================================================-->

    <div
        class="success-toast"
        *ngIf="pdfGenerated"
    >

        ✓ PDF generated successfully

    </div>


</div>
