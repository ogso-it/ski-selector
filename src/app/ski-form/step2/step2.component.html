<!-- STEP 2 CONTENT -->

<div class="step-layout">

  <!-- LEFT TEXT -->
  <div class="left">
    <h1>
      ABILITY LEVEL<br>
      IS RELEVANT<br>
      FOR CHOOSING<br>
      A SKI
    </h1>
  </div>

  <!-- RIGHT RADIO BUTTONS -->
  <div class="right">
    <h2 class="section-title">WHAT IS YOUR SKI LEVEL?</h2>
    <p class="required-field"><span class="asterisk">*</span> This field is required</p>
    
    <div class="radio-list">
      <label class="radio-option" [class.selected]="selectedLevel === 'newbie'">
        <input type="radio" 
               name="skiLevel" 
               value="newbie" 
               (change)="onLevelChange('newbie')"
               [checked]="selectedLevel === 'newbie'">
        <span class="radio-label">NEWBIE</span>
      </label>

      <label class="radio-option" [class.selected]="selectedLevel === 'intermediate'">
        <input type="radio" 
               name="skiLevel" 
               value="intermediate" 
               (change)="onLevelChange('intermediate')"
               [checked]="selectedLevel === 'intermediate'">
        <span class="radio-label">INTERMEDIATE</span>
      </label>

      <label class="radio-option" [class.selected]="selectedLevel === 'confirmed'">
        
        <input type="radio" 
               name="skiLevel" 
               value="confirmed" 
               (change)="onLevelChange('confirmed')"
               [checked]="selectedLevel === 'confirmed'">
        <span class="radio-label">CONFIRMED</span>
      </label>

      <label class="radio-option" [class.selected]="selectedLevel === 'pro-guide'">
        <input type="radio" 
               name="skiLevel" 
               value="pro-guide" 
               (change)="onLevelChange('pro-guide')"
               [checked]="selectedLevel === 'pro-guide'">
        <span class="radio-label">PRO-GUIDE</span>
      </label>
    </div>
  </div>

</div>

<!-- BUTTONS -->
<button class="prev-btn" (click)="prev()">PREV</button>
<button class="next-btn" 
        [class.disabled]="!selectedLevel"
        [disabled]="!selectedLevel"
        (click)="next()">NEXT</button>
