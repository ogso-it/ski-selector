<!-- STEP 5 CONTENT -->

<div class="step-layout">

  <!-- LEFT TEXT -->
  <div class="left">
    <h1>
      IT'S ALL<br>
      ABOUT<br>
      YOU
    </h1>
  </div>

  <!-- RIGHT RADIO BUTTONS -->
  <div class="right">
    <h2 class="section-title">DO YOU PREFER?</h2>
    <p class="required-field"><span class="asterisk">*</span> This field is required</p>
    
    <div class="radio-list">
      <label class="radio-option" [class.selected]="selectedTurn === 'short'">
        <input type="radio" 
               name="turnPreference" 
               value="short" 
               (change)="onTurnChange('short')"
               [checked]="selectedTurn === 'short'">
        <span class="radio-label">SHORT TURNS</span>
      </label>

      <label class="radio-option" [class.selected]="selectedTurn === 'long'">
        <input type="radio" 
               name="turnPreference" 
               value="long" 
               (change)="onTurnChange('long')"
               [checked]="selectedTurn === 'long'">
        <span class="radio-label">LONG TURNS</span>
      </label>
    </div>
  </div>

</div>

<!-- BUTTONS -->
<button class="prev-btn" (click)="prev()">PREV</button>
<button class="next-btn" 
        [class.disabled]="!selectedTurn"
        [disabled]="!selectedTurn"
        (click)="next()">NEXT</button>
