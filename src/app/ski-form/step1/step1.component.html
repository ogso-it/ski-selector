<div class="step1">

    <!-- =====================================================
         TEXTE
    ====================================================== -->

    <section class="step1-copy">
        <h1 class="step1-title">
            Tell us about yourself.
        </h1>

        <p class="step1-description">
            Your height and weight help us recommend the ideal ski length and flex.
        </p>
    </section>

    <!-- =====================================================
         CONTRÔLES CENTRAUX
    ====================================================== -->

    <section class="step1-controls">

        <article class="measurement measurement-height">
            <div class="measurement-value">
                <strong>{{ height }}</strong>
                <span>cm</span>
            </div>

            <div
                #heightSlider
                class="slider"
                role="slider"
                tabindex="0"
                aria-label="Height"
                [attr.aria-valuemin]="HEIGHT_MIN"
                [attr.aria-valuemax]="HEIGHT_MAX"
                [attr.aria-valuenow]="height"
                (pointerdown)="startHeightDrag($event)"
                (keydown)="onHeightKeydown($event)">

                <div class="slider-track"></div>
                <div class="slider-fill" [style.height.%]="heightPercent"></div>
                <div class="slider-thumb" [style.bottom.%]="heightPercent"></div>
            </div>

            <span class="measurement-label">Height</span>
        </article>

        <div class="ski-preview">
            <video
                #skiVideo
                class="ski-video"
                muted
                playsinline
                preload="auto">
            </video>
        </div>

        <article class="measurement measurement-weight">
            <div class="measurement-value">
                <strong>{{ weight }}</strong>
                <span>kg</span>
            </div>

            <div
                #weightSlider
                class="slider"
                role="slider"
                tabindex="0"
                aria-label="Weight"
                [attr.aria-valuemin]="WEIGHT_MIN"
                [attr.aria-valuemax]="WEIGHT_MAX"
                [attr.aria-valuenow]="weight"
                (pointerdown)="startWeightDrag($event)"
                (keydown)="onWeightKeydown($event)">

                <div class="slider-track"></div>
                <div class="slider-fill" [style.height.%]="weightPercent"></div>
                <div class="slider-thumb" [style.bottom.%]="weightPercent"></div>
            </div>

            <span class="measurement-label">Weight</span>
        </article>

    </section>

    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="step1-footer">
        <div class="step1-footer-actions">

            <button
                type="button"
                class="step1-navigation-button step1-previous-button"
                routerLink="/">
                <span aria-hidden="true">←</span>
                <span>Previous</span>
            </button>

            <button
                type="button"
                class="step1-navigation-button step1-next-button"
                (click)="next()">
                <span>Next</span>
                <span aria-hidden="true">→</span>
            </button>

        </div>
    </footer>

</div>
