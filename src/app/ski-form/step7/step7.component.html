<section class="step7">

    <!-- HEADER -->
    <header class="step7-copy">

        <h1 class="step7-title">
            What matters most to you?
        </h1>

        <p class="step7-description">
            The final piece of your skiing profile.
        </p>

    </header>


    <!-- CONTENT -->
    <div class="step7-content">

        <!-- PREVIEW -->
        <div class="step7-preview">

            <video
                #styleVideo
                class="step7-style-video"
                autoplay
                muted
                loop
                playsinline
                preload="auto">

                <source
                    src="assets/images/apparence7.webm"
                    type="video/webm">

            </video>

        </div>


        <!-- OPTIONS -->
        <div class="step7-options">

            <div class="step7-style-list">

                <!-- TECHNICAL PRECISION -->
                <label
                    class="step7-style-card"
                    [class.active]="selectedStyle === 'technical-precision'">

                    <input
                        type="radio"
                        name="skiStyle"
                        value="technical-precision"
                        [checked]="selectedStyle === 'technical-precision'"
                        (change)="onStyleChange('technical-precision')">

                    <div class="step7-card-content">

                        <h3>
                            Technical Precision
                        </h3>

                        <p>
                            Clean carving, perfect form
                        </p>

                    </div>

                </label>


                <!-- FUN & SURF -->
                <label
                    class="step7-style-card"
                    [class.active]="selectedStyle === 'fun-surf'">

                    <input
                        type="radio"
                        name="skiStyle"
                        value="fun-surf"
                        [checked]="selectedStyle === 'fun-surf'"
                        (change)="onStyleChange('fun-surf')">

                    <div class="step7-card-content">

                        <h3>
                            Fun & Surf
                        </h3>

                        <p>
                            Jumps, creative skiing
                        </p>

                    </div>

                </label>

            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer class="step7-footer">

        <div class="step7-footer-actions">

            <button
                type="button"
                class="step7-navigation-button step7-previous-button"
                (click)="prev()">

                <span aria-hidden="true">←</span>
                <span>Previous</span>

            </button>


            <button
                type="button"
                class="step7-navigation-button step7-next-button"
                [disabled]="!selectedStyle"
                (click)="next()">

                <span>Find My Ski</span>
                <span aria-hidden="true">→</span>

            </button>

        </div>

    </footer>

</section>
