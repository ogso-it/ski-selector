<!-- STEP 4 CONTENT -->

<div class="step-layout">

  <!-- LEFT TEXT -->
  <div class="left">
    <h1>
      CAMBER AND<br>
      ROCKER DEPENDS<br>
      ON MOUNTAIN<br>
      CONDITIONS<br>
      AND SNOW
    </h1>
  </div>

  <!-- RIGHT RADIO BUTTONS -->
  <div class="right">
    <h2 class="section-title">WHAT IS/ARE THE MOST COMMON SNOW TYPES YOU MIGHT ENCOUNTER?</h2>
    <p class="required-field"><span class="asterisk">*</span> This field is required</p>
    
    <div class="radio-list">
      <label class="radio-option" [class.selected]="type_snow === 'powder'">
        <input type="radio" 
               name="snowType" 
               value="powder" 
               (change)="onSnowTypeChange('powder')"
               [checked]="type_snow === 'powder'">
        <span class="radio-label">
          POWDER<br>
          <span class="subtext">(FRESH - DEEP - SLUSH)</span>
        </span>
      </label>  

      <label class="radio-option" [class.selected]="type_snow === 'crud'">
        <input type="radio" 
               name="snowType" 
               value="crud" 
               (change)="onSnowTypeChange('crud')"
               [checked]="type_snow === 'crud'">
        <span class="radio-label">
          CRUD<br>
          <span class="subtext">(CHOPPY - TRACKED - CRUST)</span>
        </span>
      </label>

      <label class="radio-option" [class.selected]="type_snow === 'hard'">
        <input type="radio" 
               name="snowType" 
               value="hard" 
               (change)="onSnowTypeChange('hard')"
               [checked]="type_snow === 'hard'">
        <span class="radio-label">
          HARD<br>
          <span class="subtext">(COMPRESSED - CONCRETE - ICE)</span>
        </span>
      </label>
    </div>
  </div>

</div>

<!-- BUTTONS -->
<button class="prev-btn" (click)="prev()">PREV</button>
<button class="next-btn" 
        [class.disabled]="!type_snow"
        [disabled]="!type_snow"
        (click)="next()">NEXT</button>
