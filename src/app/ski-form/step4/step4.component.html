<div class="step4">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <section class="step4-copy">

        <h1 class="step4-title">
            What snow do you ski most often?
        </h1>

        <p class="step4-description">
            Snow conditions shape how a ski performs.
        </p>

    </section>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <section class="step4-content">

        <!-- =================================================
             SNOW PREVIEW
        ================================================== -->

        <div class="step4-preview">

            <video
                #snowVideo
                class="step4-snow-video"
                autoplay
                muted
                loop
                playsinline
                preload="auto"
                aria-hidden="true">
            </video>

        </div>


        <!-- =================================================
             OPTIONS
        ================================================== -->

        <div class="step4-options">

            <div class="step4-snow-list">

                <!-- POWDER -->

                <label
                    class="step4-snow-card"
                    [class.active]="type_snow === 'powder'">

                    <input
                        type="radio"
                        name="snowType"
                        value="powder"
                        [checked]="type_snow === 'powder'"
                        (change)="onSnowTypeChange('powder')">

                    <div class="step4-card-content">

                        <h3>
                            Powder
                        </h3>

                        <p>
                            Fresh / Deep / Slush
                        </p>

                    </div>

                </label>


                <!-- CRUD -->

                <label
                    class="step4-snow-card"
                    [class.active]="type_snow === 'crud'">

                    <input
                        type="radio"
                        name="snowType"
                        value="crud"
                        [checked]="type_snow === 'crud'"
                        (change)="onSnowTypeChange('crud')">

                    <div class="step4-card-content">

                        <h3>
                            Crud
                        </h3>

                        <p>
                            Choppy / Tracked / Crust
                        </p>

                    </div>

                </label>


                <!-- HARD -->

                <label
                    class="step4-snow-card"
                    [class.active]="type_snow === 'hard'">

                    <input
                        type="radio"
                        name="snowType"
                        value="hard"
                        [checked]="type_snow === 'hard'"
                        (change)="onSnowTypeChange('hard')">

                    <div class="step4-card-content">

                        <h3>
                            Hard
                        </h3>

                        <p>
                            Compressed / Concrete / Ice
                        </p>

                    </div>

                </label>

            </div>

        </div>

    </section>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="step4-footer">

        <div class="step4-footer-actions">

            <button
                type="button"
                class="step4-navigation-button step4-previous-button"
                (click)="prev()">

                <span aria-hidden="true">
                    ←
                </span>

                <span>
                    Previous
                </span>

            </button>


            <button
                type="button"
                class="step4-navigation-button step4-next-button"
                [disabled]="!type_snow"
                (click)="next()">

                <span>
                    Next
                </span>

                <span aria-hidden="true">
                    →
                </span>

            </button>

        </div>

    </footer>

</div>
