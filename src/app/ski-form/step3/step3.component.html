<!-- STEP 3 CONTENT -->

<div class="step-layout">

  <!-- LEFT TEXT -->
  <div class="left">
    <h1>
      EACH TYPE OF SKI<br>
      PERFORMS DIFFERENTLY<br>
      ACCORDING TO THE TERRAIN
    </h1>
  </div>

  <!-- RIGHT SECTION (centrée) -->
  <div class="right">
    <div class="right-content">
      <h2 class="section-title">WHAT IS YOUR SKI TIP?</h2>
      <p class="required-field"><span class="asterisk">*</span> This field is required</p>
      
      <div class="radio-two-columns">
        <!-- COLONNE GAUCHE -->
        <div class="radio-column">
          <label class="radio-option" [class.selected]="selectedTechnique === 'touring-back-mountain'">
            <input type="radio" name="skiTechnique" value="touring-back-mountain" 
                   (change)="onTechniqueChange('touring-back-mountain')"
                   [checked]="selectedTechnique === 'touring-back-mountain'">
            <span class="radio-label">TOURING BACK MOUNTAIN</span>
          </label>

          <label class="radio-option" [class.selected]="selectedTechnique === 'touring-front-mountain'">
            <input type="radio" name="skiTechnique" value="touring-front-mountain" 
                   (change)="onTechniqueChange('touring-front-mountain')"
                   [checked]="selectedTechnique === 'touring-front-mountain'">
            <span class="radio-label">TOURING FRONT MOUNTAIN</span>
          </label>

          <label class="radio-option" [class.selected]="selectedTechnique === 'touring-race'">
            <input type="radio" name="skiTechnique" value="touring-race" 
                   (change)="onTechniqueChange('touring-race')"
                   [checked]="selectedTechnique === 'touring-race'">
            <span class="radio-label">TOURING RACE</span>
          </label>

          <label class="radio-option" [class.selected]="selectedTechnique === 'freetouring'">
            <input type="radio" name="skiTechnique" value="freetouring" 
                   (change)="onTechniqueChange('freetouring')"
                   [checked]="selectedTechnique === 'freetouring'">
            <span class="radio-label">FREETOURING</span>
          </label>

          <label class="radio-option" [class.selected]="selectedTechnique === 'touring-mountaineering'">
            <input type="radio" name="skiTechnique" value="touring-mountaineering" 
                   (change)="onTechniqueChange('touring-mountaineering')"
                   [checked]="selectedTechnique === 'touring-mountaineering'">
            <span class="radio-label">TOURING MOUNTAINEERING</span>
          </label>
        </div>

        <!-- COLONNE DROITE -->
        <div class="radio-column">
          <label class="radio-option" [class.selected]="selectedTechnique === 'all-mountain'">
            <input type="radio" name="skiTechnique" value="all-mountain" 
                   (change)="onTechniqueChange('all-mountain')"
                   [checked]="selectedTechnique === 'all-mountain'">
            <span class="radio-label">ALL MOUNTAIN</span>
          </label>

          <label class="radio-option" [class.selected]="selectedTechnique === 'freeride'">
            <input type="radio" name="skiTechnique" value="freeride" 
                   (change)="onTechniqueChange('freeride')"
                   [checked]="selectedTechnique === 'freeride'">
            <span class="radio-label">FREERIDE</span>
          </label>

          <label class="radio-option" [class.selected]="selectedTechnique === 'resort'">
            <input type="radio" name="skiTechnique" value="resort" 
                   (change)="onTechniqueChange('resort')"
                   [checked]="selectedTechnique === 'resort'">
            <span class="radio-label">RESORT</span>
          </label>

          <label class="radio-option" [class.selected]="selectedTechnique === 'carving'">
            <input type="radio" name="skiTechnique" value="carving" 
                   (change)="onTechniqueChange('carving')"
                   [checked]="selectedTechnique === 'carving'">
            <span class="radio-label">CARVING</span>
          </label>

          <label class="radio-option" [class.selected]="selectedTechnique === 'playride'">
            <input type="radio" name="skiTechnique" value="playride" 
                   (change)="onTechniqueChange('playride')"
                   [checked]="selectedTechnique === 'playride'">
            <span class="radio-label">PLAYRIDE</span>
          </label>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- BUTTONS -->
<button class="prev-btn" (click)="prev()">PREV</button>
<button class="next-btn" 
        [class.disabled]="!selectedTechnique"
        [disabled]="!selectedTechnique"
        (click)="next()">NEXT</button>
