<div class="step3">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <section class="step3-copy">

        <h1 class="step3-title">
            Where do you spend most of your time?
        </h1>

        <p class="step3-description">
            Every terrain demands a different kind of ski.
        </p>

    </section>

    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <section class="step3-content">

        <div class="step3-preview">

            <video
                #terrainVideo
                class="step3-terrain-video"
                muted
                playsinline
                preload="auto">
            </video>

        </div>

        <div class="step3-options">

            <div class="step3-terrain-grid">

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'touring-back-mountain'">

                    <input
                        type="radio"
                        name="terrain"
                        value="touring-back-mountain"
                        [checked]="selectedTechnique === 'touring-back-mountain'"
                        (change)="onTechniqueChange('touring-back-mountain')">

                    <span>Touring Back Mountain</span>

                </label>

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'touring-front-mountain'">

                    <input
                        type="radio"
                        name="terrain"
                        value="touring-front-mountain"
                        [checked]="selectedTechnique === 'touring-front-mountain'"
                        (change)="onTechniqueChange('touring-front-mountain')">

                    <span>Touring Front Mountain</span>

                </label>

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'touring-race'">

                    <input
                        type="radio"
                        name="terrain"
                        value="touring-race"
                        [checked]="selectedTechnique === 'touring-race'"
                        (change)="onTechniqueChange('touring-race')">

                    <span>Touring Race</span>

                </label>

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'freetouring'">

                    <input
                        type="radio"
                        name="terrain"
                        value="freetouring"
                        [checked]="selectedTechnique === 'freetouring'"
                        (change)="onTechniqueChange('freetouring')">

                    <span>Freetouring</span>

                </label>

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'touring-mountaineering'">

                    <input
                        type="radio"
                        name="terrain"
                        value="touring-mountaineering"
                        [checked]="selectedTechnique === 'touring-mountaineering'"
                        (change)="onTechniqueChange('touring-mountaineering')">

                    <span>Touring Mountaineering</span>

                </label>

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'all-mountain'">

                    <input
                        type="radio"
                        name="terrain"
                        value="all-mountain"
                        [checked]="selectedTechnique === 'all-mountain'"
                        (change)="onTechniqueChange('all-mountain')">

                    <span>All Mountain</span>

                </label>

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'freeride'">

                    <input
                        type="radio"
                        name="terrain"
                        value="freeride"
                        [checked]="selectedTechnique === 'freeride'"
                        (change)="onTechniqueChange('freeride')">

                    <span>Freeride</span>

                </label>

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'resort'">

                    <input
                        type="radio"
                        name="terrain"
                        value="resort"
                        [checked]="selectedTechnique === 'resort'"
                        (change)="onTechniqueChange('resort')">

                    <span>Resort</span>

                </label>

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'carving'">

                    <input
                        type="radio"
                        name="terrain"
                        value="carving"
                        [checked]="selectedTechnique === 'carving'"
                        (change)="onTechniqueChange('carving')">

                    <span>Carving</span>

                </label>

                <label
                    class="step3-terrain-card"
                    [class.active]="selectedTechnique === 'playride'">

                    <input
                        type="radio"
                        name="terrain"
                        value="playride"
                        [checked]="selectedTechnique === 'playride'"
                        (change)="onTechniqueChange('playride')">

                    <span>Playride</span>

                </label>

            </div>

        </div>

    </section>

    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="step3-footer">

        <div class="step3-footer-actions">

            <button
                type="button"
                class="step3-navigation-button step3-previous-button"
                (click)="prev()">

                <span aria-hidden="true">←</span>
                <span>Previous</span>

            </button>

            <button
                type="button"
                class="step3-navigation-button step3-next-button"
                [disabled]="!selectedTechnique"
                (click)="next()">

                <span>Next</span>
                <span aria-hidden="true">→</span>

            </button>

        </div>

    </footer>

</div>
