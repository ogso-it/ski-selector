<section class="step6">

    <!-- HEADER -->
    <header class="step6-copy">



        <h1 class="step6-title">
            What speed do you prefer?
        </h1>

        <p class="step6-description">
            Your preferred pace helps us define the right level of stability
            and responsiveness.
        </p>

    </header>


    <!-- CONTENT -->
    <div class="step6-content">

        <!-- ANIMATION -->
        <div class="step6-preview">

            <video
                #speedVideo
                class="step6-speed-video"
                autoplay
                muted
                loop
                playsinline
                preload="auto"
            >
                <source
                    src="assets/images/apparence6.webm"
                    type="video/webm">
            </video>

        </div>


        <!-- OPTIONS -->
        <div class="step6-options">

            <div class="step6-speed-list">

                <!-- MODERATE SPEED -->
                <label
                    class="step6-speed-card"
                    [class.active]="selectedSpeed === 'moderate-speed'"
                >

                    <input
                        type="radio"
                        name="speedPreference"
                        value="moderate-speed"
                        [checked]="selectedSpeed === 'moderate-speed'"
                        (change)="onSpeedChange('moderate-speed')"
                    >

                    <div class="step6-card-content">

                        <h3>
                            Moderate Speed
                        </h3>

                        <p>
                            Controlled, comfortable and confidence-inspiring
                        </p>

                    </div>

                </label>


                <!-- HIGH SPEED -->
                <label
                    class="step6-speed-card"
                    [class.active]="selectedSpeed === 'high-speed'"
                >

                    <input
                        type="radio"
                        name="speedPreference"
                        value="high-speed"
                        [checked]="selectedSpeed === 'high-speed'"
                        (change)="onSpeedChange('high-speed')"
                    >

                    <div class="step6-card-content">

                        <h3>
                            High Speed
                        </h3>

                        <p>
                            Fast, powerful and highly stable
                        </p>

                    </div>

                </label>

            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer class="step6-footer">

        <div class="step6-footer-actions">

            <button
                type="button"
                class="step6-navigation-button step6-previous-button"
                (click)="prev()"
            >
                <span aria-hidden="true">←</span>
                <span>Previous</span>
            </button>


            <button
                type="button"
                class="step6-navigation-button step6-next-button"
                [disabled]="!selectedSpeed"
                (click)="next()"
            >
                <span>Next</span>
                <span aria-hidden="true">→</span>
            </button>

        </div>

    </footer>

</section>
