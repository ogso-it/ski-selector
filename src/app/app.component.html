<!-- SPS MUSIC CONTROL -->

<button
  type="button"
  class="sps-sound"
  [class.sps-sound--active]="soundEnabled"
  [class.sps-sound--playing]="isPlaying"
  (click)="toggleSound()"
  [attr.aria-pressed]="soundEnabled"
  [attr.aria-label]="soundEnabled ? 'Turn music off' : 'Turn music on'"
  [attr.title]="soundEnabled ? 'Music on' : 'Music off'"
>

  <!-- Double croche : la note se balance quand la musique joue, barrée quand elle est coupée -->
  <svg class="sps-sound__note" viewBox="0 0 24 24" aria-hidden="true">
    <path class="sps-sound__stems" d="M9 18V5.6l11-2.1V16" />
    <path class="sps-sound__beam" d="M9 5.6l11-2.1v2.7L9 8.3z" />
    <ellipse cx="6.4" cy="18" rx="2.9" ry="2.3" transform="rotate(-20 6.4 18)" />
    <ellipse cx="17.4" cy="16" rx="2.9" ry="2.3" transform="rotate(-20 17.4 16)" />
    <line class="sps-sound__slash" x1="3.5" y1="3.5" x2="20.5" y2="20.5" />
  </svg>

  <!-- Petites notes qui s'envolent pendant la lecture -->
  <span class="sps-sound__float sps-sound__float--1" aria-hidden="true">♪</span>
  <span class="sps-sound__float sps-sound__float--2" aria-hidden="true">♫</span>

</button>
