<div class="home-container">

  <!-- VIDEO BACKGROUND -->
  <video #videoBg class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="assets/images/BACKGROUND.webm" type="video/webm">
  </video>
  
  <!-- PANEL WRAPPER -->
  <div class="panel-wrapper">

    <div class="panel">

      <img src="assets/images/fond.webp" class="panel-bg" alt="panel">

      <div class="panel-content">

        <!-- HEADER -->
        <div class="panel-header">
          <div class="header-left">
            <h3>OGSO SMART PRODUCT SELECTOR</h3>

            <div class="steps">
              <span [class.active]="currentStep === 1">1</span>
              <span [class.active]="currentStep === 2">2</span>
              <span [class.active]="currentStep === 3">3</span>
              <span [class.active]="currentStep === 4">4</span>
              <span [class.active]="currentStep === 5">5</span>
              <span [class.active]="currentStep === 6">6</span>
              <span [class.active]="currentStep === 7">7</span>
            </div>
          </div>

          <div class="header-right">
            <img src="assets/images/ogsologo.png" alt="OGSO" class="ogso-logo">
          </div>
        </div>

        <!-- BODY -->
        <div class="panel-body">
          <!-- CONTENU DYNAMIQUE DES STEPS -->
          <router-outlet></router-outlet>
        </div>

      </div>
    </div>
  </div>
</div>
