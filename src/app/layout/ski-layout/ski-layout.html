<div class="layout-container" [class.is-home]="isHome">

    <video
        #bgVideo
        class="layout-bg-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="assets/images/backupvideo.png">

        <source
            src="assets/images/NEWanimatedbackground.webm"
            type="video/webm">

        <source
            src="assets/images/NEWanimatedbackground.mp4"
            type="video/mp4">

    </video>

    <div class="layout-panel-wrapper">
        <div class="layout-panel" #panel>

            <picture
                class="layout-panel-picture"
                aria-hidden="true">

                <source
                    media="(max-width:600px) and (min-resolution:2dppx)"
                    srcset="assets/images/banner2.png">

                <source
                    media="(max-width:600px)"
                    srcset="assets/images/banner1.png">

                <source
                    media="(min-width:601px) and (max-width:1024px) and (orientation:portrait)"
                    srcset="assets/images/banner3.png">

                <source
                    media="(min-width:601px) and (max-width:1024px) and (orientation:landscape)"
                    srcset="assets/images/banner4.png">

                <img
                    class="layout-panel-bg"
                    src="assets/images/BannerStup.png"
                    alt="">

            </picture>

            <div class="layout-panel-content">

                <!-- Safe area aligned to the useful inside of each banner -->
                <div class="layout-safe-area">

                    <header class="layout-header">

                        <div class="layout-header-left">

                            <div class="layout-mobile-step">
                                Step {{ currentStep }} of {{ steps.length }}
                                <span class="layout-mobile-progress" aria-hidden="true">
                                    <span [style.width.%]="progressPercent"></span>
                                </span>
                            </div>

                            <h3 class="layout-header-title">
                                OGSO SMART PRODUCT SELECTOR
                            </h3>

                            <nav
                                class="layout-steps-container"
                                aria-label="Progress">

                                <button
                                    *ngFor="let step of steps"
                                    type="button"
                                    class="step-number"
                                    [class.active]="currentStep===step"
                                    [class.completed]="currentStep>step"
                                    [disabled]="step>=currentStep"
                                    [attr.aria-current]="currentStep===step ? 'step' : null"
                                    [attr.aria-label]="'Step ' + step"
                                    (click)="goToStep(step)">
                                    {{ step }}
                                </button>

                            </nav>

                        </div>

                        <div class="layout-header-right">
                            <img
                                class="layout-logo"
                                src="assets/images/ogsologo.png"
                                alt="OGSO">
                        </div>

                    </header>

                    <main class="layout-body">
                        <div class="layout-body-content">
                            <router-outlet></router-outlet>
                        </div>
                    </main>

                </div>

            </div>

        </div>
    </div>

</div>
