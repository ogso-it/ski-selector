<div class="layout-container">

  <!-- VIDEO BACKGROUND -->
  <video
    class="layout-bg-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    poster="assets/images/backupvideo.png">

    <source src="assets/images/BACKGROUND.webm" type="video/webm">
    <source src="assets/images/BACKGROUND.mp4" type="video/mp4">

  </video>

  <div class="layout-panel-wrapper">

    <div class="layout-panel">

      <img src="assets/images/fond.webp" class="layout-panel-bg" alt="panel">

      <div class="layout-panel-content">

        <!-- HEADER -->
        <div class="layout-header">

          <div class="layout-header-left">
            <h3 class="layout-header-title">
              OGSO SMART PRODUCT SELECTOR
            </h3>
            
            <!-- Progress bar avec indices dynamiques -->
            <div class="layout-steps-container">
              <span 
                *ngFor="let step of [1,2,3,4,5,6,7]" 
                class="step-number"
                [class.active]="currentStep === step"
                [class.completed]="currentStep > step">
                {{ step }}
              </span>
            </div>
          </div>

          <div class="layout-header-right">
            <img src="assets/images/ogsologo.png" class="layout-logo" alt="OGSO">
          </div>

        </div>

        <!-- CONTENT -->
        <div class="layout-body">
          <router-outlet></router-outlet>
        </div>

      </div>

    </div>

  </div>

</div>
